<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scheme details — AI Bureaucracy Navigator</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="landing">

<nav class="landing-nav">
  <a class="logo" href="/">Bureaucracy&nbsp;Navigator</a>
  <div class="nav-links">
    <div data-lang-mount></div>
    <a href="/app.html" data-i18n="nav.backToResults">← Back to my results</a>
  </div>
</nav>

<div class="detail-wrap" id="detail">
  <p class="detail-loading" data-i18n="schemeDetail.loading">Loading scheme…</p>
</div>

<script src="i18n.js"></script>
<script>
const id = new URLSearchParams(location.search).get("id");
const box = document.getElementById("detail");

// the user's own verdict, if they arrived from a results run
const finding = (JSON.parse(sessionStorage.getItem("nav_findings") || "[]"))
  .find(f => f.scheme_id === id);

function verdictSection() {
  if (!finding) return "";
  const label = {
    eligible: t("findings.statusEligible"),
    possible: t("findings.statusPossible"),
    ineligible: t("findings.statusIneligible"),
  }[finding.status];
  return `
  <section class="detail-section your-verdict">
    <div class="eyebrow">${t("schemeDetail.yourResultEyebrow")}</div>
    <div class="verdict-head">
      <span class="pill ${finding.status}">${label}</span>
      <span class="verdict-note">${t("schemeDetail.yourResultNote")}</span>
    </div>
    <ul class="reasons">${finding.reasons.map(r => `<li>${r}</li>`).join("")}</ul>
  </section>`;
}

async function render() {
  if (!id) { box.innerHTML = `<p class="detail-loading">${t("schemeDetail.noScheme")}</p>`; return; }
  const res = await fetch(`/api/schemes/${encodeURIComponent(id)}?lang=${window._i18nLang || "en"}`);
  if (!res.ok) { box.innerHTML = `<p class="detail-loading">${t("schemeDetail.notFound")}</p>`; return; }
  const s = await res.json();
  document.title = `${s.name} — AI Bureaucracy Navigator`;

  const missing = new Set(finding ? finding.documents_missing : []);
  const docRow = (d) => {
    if (!finding) return `<li><span class="doc-mark">•</span>${d}</li>`;
    return missing.has(d)
      ? `<li><span class="doc-mark miss">✗</span>${d} <span class="doc-note">${t("schemeDetail.docMissing")}</span></li>`
      : `<li><span class="doc-mark have">✓</span>${d} <span class="doc-note">${t("schemeDetail.docHave")}</span></li>`;
  };

  box.innerHTML = `
    <div class="detail-head">
      <div class="chips">
        <span class="chip">${s.category}</span>
        <span class="chip">${s.level === "central" ? t("schemeDetail.centralGovernment") : s.state}</span>
      </div>
      <h1>${s.name}</h1>
      <div class="detail-benefit">${s.benefit}</div>
    </div>

    ${verdictSection()}

    <section class="detail-section">
      <div class="eyebrow">${t("schemeDetail.aboutEyebrow")}</div>
      <p class="detail-desc">${s.description}</p>
    </section>

    <section class="detail-section">
      <div class="eyebrow">${t("schemeDetail.eligibleEyebrow")}</div>
      <ul class="criteria">${s.criteria.map(c => `<li>${c}</li>`).join("")}</ul>
      <p class="detail-fineprint">${t("schemeDetail.eligibleFineprint")}</p>
    </section>

    <section class="detail-section">
      <div class="eyebrow">${t("schemeDetail.documentsEyebrow")}</div>
      <ul class="doc-list">${s.documents.map(docRow).join("")}</ul>
    </section>

    <section class="detail-section">
      <div class="eyebrow">${t("schemeDetail.applyEyebrow")}</div>
      <p class="detail-desc">${s.apply_mode}</p>
      <a class="btn btn-primary btn-lg" href="${s.official_url}" target="_blank" rel="noopener">
        ${t("schemeDetail.openPortal")}
      </a>
      <div class="source" style="margin-top:16px">
        <span>${new URL(s.official_url).hostname}</span>
        <span>${t("schemeDetail.linkVerified")} ${s.last_verified}</span>
      </div>
    </section>
  `;
}

// wait for i18n to be ready before first render, then re-render (re-fetching
// in the new language) whenever the user switches language
document.addEventListener("i18n:changed", render);
if (Object.keys(window._i18nDict || {}).length) render();
</script>
</body>
</html>
